services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # travels.db is bind-mounted so data persists across container rebuilds.
    # If the file doesn't exist yet, run: touch backend/travels.db before composing up.
    volumes:
      - ./backend/travels.db:/app/travels.db
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge
